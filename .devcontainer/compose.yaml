name: roltrapstuk-dev

services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

# No database service: the app talks to Postgres through
# @neondatabase/serverless, which uses HTTP/WebSockets to a Neon endpoint rather
# than TCP, so it can't reach a plain postgres:// container without a proxy.
# The container uses the in-memory store; for real Postgres put a Neon
# connection string in .env.local, same as a local checkout.
