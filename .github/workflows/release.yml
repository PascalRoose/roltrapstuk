name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump + create tags and GitHub Releases
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Runs on every push to main: analyses the commits since the last tag and,
      # when there is something to release, bumps the version, updates
      # CHANGELOG.md, commits both back to main, tags, and publishes a GitHub
      # Release. No-ops when the commits don't warrant a release.
      #
      # If main is a protected branch, GITHUB_TOKEN must be allowed to push to it
      # (or set a GH_TOKEN secret with a PAT / GitHub App token that can).
      - run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
