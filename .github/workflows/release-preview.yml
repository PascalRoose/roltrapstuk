name: Release preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Needs a same-repo branch (checkout by ref) and a writable token; skip forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write # semantic-release --dry-run still runs a `git push --dry-run` auth check; nothing is pushed
      pull-requests: write # post/update the preview comment
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }} # the PR branch itself, not the merge ref
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Runs semantic-release against the PR branch in dry-run mode with only the
      # analysis plugins, so it reports the version and notes without touching
      # git, GitHub or npm. semantic-release refuses to run from a pull_request
      # build, so the CI env vars are unset for this step and it falls back to
      # plain-git detection of the checked-out PR branch. The result is rendered
      # into comment.md.
      #
      # The plugin list is trimmed in .releaserc.json itself rather than
      # passed via --plugins, so the commit-analyzer/release-notes-generator
      # options (the conventionalcommits preset and the custom `breaking` ->
      # major releaseRule) are kept intact instead of falling back to the
      # angular preset's defaults, which don't recognise the `breaking`
      # commit type. (--extends merges plugin arrays by index instead of
      # replacing them, so overwriting the file directly is used instead.)
      # The checkout is discarded after the job, so mutating it in place is
      # safe.
      - name: Build preview comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: "0"
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          unset GITHUB_ACTIONS GITHUB_EVENT_NAME GITHUB_REF GITHUB_SHA \
            GITHUB_RUN_ID GITHUB_HEAD_REF GITHUB_BASE_REF GITHUB_EVENT_PATH CI

          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('.releaserc.json', 'utf8'));
            const analysisPlugins = new Set([
              '@semantic-release/commit-analyzer',
              '@semantic-release/release-notes-generator',
            ]);
            cfg.branches = [process.env.HEAD_REF];
            cfg.plugins = cfg.plugins.filter((p) =>
              analysisPlugins.has(Array.isArray(p) ? p[0] : p),
            );
            fs.writeFileSync('.releaserc.json', JSON.stringify(cfg, null, 2));
          "

          npx --no-install semantic-release \
            --dry-run \
            > release.log 2>&1 || true
          cat release.log

          version="$(grep -oE 'The next release version is [0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?' release.log | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?' | head -n1 || true)"

          {
            echo "### 📦 Release preview"
            echo
            if [ -n "$version" ]; then
              echo "Merging this PR will publish **roltrapstuk-v${version}**."
              notes="$(awk '/Release note for version/{f=1;next} /^\[[0-9]+:[0-9]+/||/^npm (notice|warn|error)/{f=0} f' release.log | sed 's/^ \{1,4\}//' || true)"
              if [ -n "$notes" ]; then
                echo
                echo "<details><summary>Release notes</summary>"
                echo
                echo "$notes"
                echo
                echo "</details>"
              fi
            else
              echo "No release — the commits on this branch don't trigger a version bump."
            fi
            echo
            echo "<sub>Updated for ${HEAD_SHA}</sub>"
          } > comment.md

          cat comment.md

      - name: Post preview comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: release-preview
          path: comment.md
