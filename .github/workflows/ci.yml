name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test + coverage
        run: npm run coverage

      - name: Upload coverage
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Single stable check for the `main` branch ruleset to require. The matrix job
  # names above carry the Node version and would need re-listing in the ruleset
  # on every Node bump; this one does not.
  ci:
    name: CI
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Verify the matrix succeeded
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "verify matrix result: ${{ needs.verify.result }}"
            exit 1
          fi
