name: Dependabot auto-merge

# Turns on GitHub's native auto-merge for Dependabot PRs that are patch-level
# only. The merge still waits for every required check and the Preview
# deployment in the `main` ruleset — this only removes the manual click.
#
# Minor and major updates are left for a human on purpose. Grouped PRs report
# the highest bump in the group, so a group auto-merges only when every member
# is a patch.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
