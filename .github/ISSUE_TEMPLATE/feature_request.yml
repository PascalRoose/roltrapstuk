name: Feature request
description: Suggest an improvement or a new station
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do that the app doesn't let you do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: input
    id: station
    attributes:
      label: Station (if you're proposing a new one)
      placeholder: Utrecht Centraal
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
